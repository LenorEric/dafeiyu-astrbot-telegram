services:
  astrbot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: dafeiyu-telegram:local
    container_name: astrbot
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      DAFEIYU_TELEGRAM_GUARD: '1'
      PYTHONPATH: /opt/dafeiyu/deploy/telegram
    ports:
      - '127.0.0.1:6185:6185'
    volumes:
      - ./data:/AstrBot/data
    entrypoint: ['python', '/opt/dafeiyu/deploy/telegram/run.py']
    working_dir: /AstrBot
